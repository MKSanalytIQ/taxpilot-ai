name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-secret-not-used-at-runtime-32b
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx next build
